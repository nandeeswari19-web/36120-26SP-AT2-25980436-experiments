[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "weather_intelligence_mod"
version = "0.0.1"
description = "Assignment 2"
authors = [
  { name = "Nandeeswari Kumaravelu" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
    "xgboost",
    "requests",
    "joblib",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["weather_intelligence_mod"]
include = ["pyproject.toml", "weather_intelligence_mod/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["weather_intelligence_mod"]
force-sort-within-sections = true

